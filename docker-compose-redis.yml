version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: v-app-redis
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - v-app-network

  # Optional: Redis Commander for GUI management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: v-app-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - v-app-network

volumes:
  redis-data:
    driver: local

networks:
  v-app-network:
    driver: bridge
