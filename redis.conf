# =============================================================================
# Redis Configuration for V-App VPN Access
# =============================================================================
# This configuration file is used by the Docker container
# Optimized for VPN access from multiple machines
# =============================================================================

# -----------------------------------------------------------------------------
# Network Configuration
# -----------------------------------------------------------------------------

# Bind to all network interfaces to allow VPN access
# For production, bind to specific IP: bind 100.122.105.63
bind 0.0.0.0

# Accept connections on port 6379
port 6379

# Protected mode (disabled for development/VPN)
# IMPORTANT: Enable this in production and set requirepass
protected-mode no

# TCP listen() backlog
tcp-backlog 511

# Close connection after client idle for N seconds (0 to disable)
timeout 300

# TCP keepalive
tcp-keepalive 300

# -----------------------------------------------------------------------------
# General Configuration
# -----------------------------------------------------------------------------

# Run as a daemon (no for Docker)
daemonize no

# Process ID file
pidfile /var/run/redis.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file (empty string = log to stdout, good for Docker)
logfile ""

# Number of databases
databases 16

# Show Redis logo on startup
always-show-logo no

# -----------------------------------------------------------------------------
# Snapshotting (Persistence)
# -----------------------------------------------------------------------------

# Save the DB to disk
# save <seconds> <changes>
save 900 1      # After 900 sec (15 min) if at least 1 key changed
save 300 10     # After 300 sec (5 min) if at least 10 keys changed
save 60 10000   # After 60 sec if at least 10000 keys changed

# Stop accepting writes if RDB snapshots fail
stop-writes-on-bgsave-error yes

# Compress string objects using LZF
rdbcompression yes

# Checksum for RDB files
rdbchecksum yes

# RDB file name
dbfilename dump.rdb

# Working directory
dir /data

# -----------------------------------------------------------------------------
# Replication (for master-slave setup)
# -----------------------------------------------------------------------------

# Uncomment for slave configuration
# replicaof <masterip> <masterport>
# masterauth <master-password>

# Allow writes on replica
replica-read-only yes

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------

# Require password for connections
# IMPORTANT: Uncomment and set a strong password for production
# requirepass your-strong-password-here

# Rename dangerous commands (recommended for production)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command SHUTDOWN SHUTDOWN_SECRET_NAME

# -----------------------------------------------------------------------------
# Memory Management
# -----------------------------------------------------------------------------

# Maximum memory limit (should match docker-compose settings)
maxmemory 256mb

# Memory eviction policy when maxmemory is reached
# Options:
# - noeviction: Return error when memory limit is reached
# - allkeys-lru: Evict any key using LRU algorithm
# - volatile-lru: Evict keys with expire set using LRU
# - allkeys-random: Evict random keys
# - volatile-random: Evict random keys with expire set
# - volatile-ttl: Evict keys with expire set and shortest TTL
maxmemory-policy allkeys-lru

# LRU and minimal TTL algorithms are not precise
maxmemory-samples 5

# -----------------------------------------------------------------------------
# Append Only File (AOF) - Durability
# -----------------------------------------------------------------------------

# Enable AOF persistence
appendonly yes

# AOF file name
appendfilename "appendonly.aof"

# AOF fsync policy
# Options:
# - always: fsync every write (slow, safest)
# - everysec: fsync every second (good balance)
# - no: Don't fsync, let OS flush data (fast, less durable)
appendfsync everysec

# Don't use fsync during BGSAVE or BGREWRITEAOF
no-appendfsync-on-rewrite no

# Automatic AOF rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF file on startup
aof-load-truncated yes

# Use RDB-AOF hybrid persistence
aof-use-rdb-preamble yes

# -----------------------------------------------------------------------------
# Slow Log
# -----------------------------------------------------------------------------

# Log queries slower than N microseconds
slowlog-log-slower-than 10000

# Maximum slow log length
slowlog-max-len 128

# -----------------------------------------------------------------------------
# Event Notification
# -----------------------------------------------------------------------------

# Keyspace notifications
# Options: K (keyspace events), E (keyevent events), g (generic commands),
#          $ (string commands), l (list commands), s (set commands),
#          h (hash commands), z (sorted set commands), x (expired events),
#          e (evicted events), A (alias for "g$lshzxe")
notify-keyspace-events ""

# -----------------------------------------------------------------------------
# Advanced Config
# -----------------------------------------------------------------------------

# Hash data structure optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Streams macro node max size
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of active defrag cycle
hz 10

# Enable active defragmentation
activedefrag no

# -----------------------------------------------------------------------------
# VPN Access Notes
# -----------------------------------------------------------------------------
# 
# This Redis instance is configured for VPN access with:
# - Bind to 0.0.0.0 (all interfaces)
# - Protected mode disabled
# - Port 6379 exposed
#
# Security recommendations for production:
# 1. Enable protected-mode yes
# 2. Set requirepass with strong password
# 3. Bind to specific VPN IP instead of 0.0.0.0
# 4. Use firewall rules to restrict access
# 5. Enable TLS/SSL encryption
# 6. Rename dangerous commands
#
# =============================================================================
