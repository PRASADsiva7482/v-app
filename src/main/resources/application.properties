spring.application.name=v-app
spring.profiles.active=dev
spring.profiles.include=datasource,feature,cpdetails,audit,keycloak,redis

# Exclude auto-configurations that conflict with custom multi-datasource setup
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.graphql.GraphQlAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.va.v.v_app=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
# Bind to all interfaces (0.0.0.0) for VPN/network access
server.address=0.0.0.0
server.port=2000
server.servlet.context-path=/v-app

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
spring.servlet.multipart.file-size-threshold=2MB

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Enable try-it-out by default
springdoc.swagger-ui.tryItOutEnabled=true
# Persist authorization data between page refreshes
springdoc.swagger-ui.persistAuthorization=true
# Enable filter box for searching endpoints
springdoc.swagger-ui.filter=true
# Display request duration in responses
springdoc.swagger-ui.displayRequestDuration=true
# Show model properties when inline
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.showCommonExtensions=true
# Disable default models section expansion
springdoc.swagger-ui.defaultModelsExpandDepth=1
# Disable default models display
springdoc.swagger-ui.defaultModelExpandDepth=1

# JWT Configuration (Change secret in production!)
jwt.secret=your-256-bit-secret-key-change-this-in-production-minimum-32-characters-required
jwt.expiration=86400000
jwt.issuer=v-app
jwt.enabled=true

# Security Configuration
logging.level.org.springframework.security=DEBUG

# CORS Configuration (B-13)
# Comma-separated list of allowed origins. Override in production.
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://100.81.139.115:3000

# Async Configuration (B-11) — enables @Async for PostService.incrementViewCount
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
