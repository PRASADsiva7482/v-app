spring.application.name=v-app
spring.profiles.active=dev
spring.profiles.include=datasource,feature,cpdetails,audit,keycloak,redis

# Exclude auto-configurations that conflict with custom multi-datasource setup
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.graphql.GraphQlAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Logging Configuration ──
# SECURITY: Reduce logging in production to prevent info leakage in logs.
# Override these in application-dev.properties for development only.
logging.level.root=INFO
logging.level.com.va.v.v_app=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN

# ── Server Configuration ── HARDENED
server.address=0.0.0.0
server.port=2000
server.servlet.context-path=/v-app

# SECURITY: Hide server identity
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.server-header=

# SECURITY: Throw exception for unmapped URLs (prevent path enumeration)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
spring.servlet.multipart.file-size-threshold=2MB

# ── SpringDoc OpenAPI (Swagger) Configuration ──
# SECURITY: Disable in production. Enable only in dev profile.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.showCommonExtensions=true
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters-required}
jwt.expiration=86400000
jwt.issuer=v-app
jwt.enabled=true

# CORS Configuration
# Comma-separated list of allowed origins. Override in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://100.81.139.115:3000}

# ── Actuator Security ──
# Only expose health endpoint. NEVER expose env, beans, configprops, etc.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.mappings.enabled=false
management.endpoint.info.enabled=false

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# ── Rate Limiting ──
app.security.rate-limit.max-requests=120
app.security.rate-limit.login-max-requests=10
