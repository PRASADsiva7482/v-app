spring.application.name=v-app
spring.profiles.active=dev
spring.profiles.include=datasource,feature,cpdetails,audit,keycloak

# Exclude auto-configurations that conflict with custom multi-datasource setup
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.graphql.GraphQlAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.va.v.v_app=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
server.port=8080
server.servlet.context-path=/v-app

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT Configuration (Change secret in production!)
jwt.secret=your-256-bit-secret-key-change-this-in-production-minimum-32-characters-required
jwt.expiration=86400000
jwt.issuer=v-app
jwt.enabled=true

# Security Configuration
logging.level.org.springframework.security=DEBUG

