# Feature Configuration
feature:
  mappings:
    coreSystemConfig:
      dynamicDetails:
        skipEntityIdUrls: graphQl, login
  # Example feature flags and service implementations
  customerManagement:
    service-impl: customerManagementServiceImpl
    dynamicDetails:
      enableValidation: true
      maxRetryAttempts: 3
      timeoutSeconds: 30
  
  subscriptionManagement:
    service-impl: subscriptionManagementServiceImpl
    dynamicDetails:
      enableAutoRenewal: true
      gracePeriodDays: 7
      notificationEnabled: true
  
  billingManagement:
    service-impl: billingManagementServiceImpl
    dynamicDetails:
      enableInvoiceGeneration: true
      paymentGatewayEnabled: true
      invoiceFormat: PDF
  
  reportGeneration:
    service-impl: reportGenerationServiceImpl
    dynamicDetails:
      enableScheduledReports: true
      maxReportSize: 5000
      exportFormats: CSV,PDF,EXCEL
  
  # Social Media Features (Twitter-like)
  media:
    storage:
      base-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}
      image-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}/images
      video-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}/videos
      thumbnail-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}/thumbnails
    upload:
      max-file-size: 10485760  # 10MB in bytes
      max-image-size: 5242880   # 5MB in bytes
      max-video-size: 52428800  # 50MB in bytes
      allowed-image-types: jpg,jpeg,png,gif,webp
      allowed-video-types: mp4,webm,mov
  
  social:
    pagination:
      default-page-size: 20
      max-page-size: 100
    feed:
      timeline-cache-minutes: 5
      explore-cache-minutes: 15
