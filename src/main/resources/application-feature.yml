# Feature Configuration
feature:
  mappings:
    coreSystemConfig:
      dynamicDetails:
        skipEntityIdUrls: graphQl, login
  # Example feature flags and service implementations
  customerManagement:
    service-impl: customerManagementServiceImpl
    dynamicDetails:
      enableValidation: true
      maxRetryAttempts: 3
      timeoutSeconds: 30
  
  subscriptionManagement:
    service-impl: subscriptionManagementServiceImpl
    dynamicDetails:
      enableAutoRenewal: true
      gracePeriodDays: 7
      notificationEnabled: true
  
  billingManagement:
    service-impl: billingManagementServiceImpl
    dynamicDetails:
      enableInvoiceGeneration: true
      paymentGatewayEnabled: true
      invoiceFormat: PDF
  
  reportGeneration:
    service-impl: reportGenerationServiceImpl
    dynamicDetails:
      enableScheduledReports: true
      maxReportSize: 5000
      exportFormats: CSV,PDF,EXCEL
  
  # Social Media Features (Twitter-like)
  media:
    storage:
      base-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}
      image-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}/images
      video-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}/videos
      thumbnail-path: ${MEDIA_STORAGE_PATH:D:/project/uploaded_data}/thumbnails
    upload:
      max-file-size: 26214400  # 25MB in bytes
      max-image-size: 5242880   # 5MB in bytes
      max-video-size: 26214400  # 25MB in bytes (supports ~4min videos)
      allowed-image-types: jpg,jpeg,png,gif,webp
      allowed-video-types: mp4,webm,mov
  
  social:
    pagination:
      default-page-size: 20
      max-page-size: 100
    feed:
      timeline-cache-minutes: 5
      explore-cache-minutes: 15
      
    # ========================================================================
    # FOR YOU FEED - Enterprise-Grade Configuration
    # ========================================================================
    for-you:
      # Ranking Algorithm Weights (Engagement Score)
      ranking:
        weights:
          likes: 3.0              # Like weight
          comments: 5.0           # Comment weight (higher engagement)
          shares: 7.0             # Share/repost weight (viral potential)
          views: 0.1              # View weight (low impact)
          engagement-velocity: 10.0  # Engagement rate boost
        
        # Time Decay Configuration
        time-decay:
          enabled: true
          decay-rate: 0.5         # Decay factor (0-1, lower = faster decay)
          half-life-hours: 24     # Time when score is halved
          max-age-days: 30        # Max age for posts in feed
        
        # Recency Bonus (additive)
        recency-bonus:
          last-hour: 200.0        # Posts < 1 hour old
          last-6-hours: 150.0     # Posts < 6 hours old
          last-24-hours: 100.0    # Posts < 24 hours old
          last-7-days: 50.0       # Posts < 7 days old
          last-30-days: 10.0      # Posts < 30 days old
        
        # Media Bonus
        media-bonus:
          has-image: 20.0
          has-video: 30.0
          has-multiple: 40.0
      
      # Personalization Configuration
      personalization:
        enabled: true
        
        # User Affinity Boost
        affinity:
          following-boost: 1.5    # Multiply score by 1.5 for followed users
          mutual-boost: 2.0       # Mutual follows get 2x
          interaction-boost: 1.3  # Users you interact with
          
        # Interest Matching
        interest-matching:
          enabled: true
          hashtag-match-boost: 50.0
          topic-match-boost: 30.0
          
      # Feed Composition Mix (percentages)
      composition:
        global-trending: 40       # % from global trending
        following: 35             # % from following users
        interest-based: 20        # % from interests/tags
        discovery: 5              # % random/new content
      
      # Redis Cache Configuration
      cache:
        global-trending:
          ttl-seconds: 300        # 5 minutes
          recalculate-interval: 300  # Recalculate every 5 min
        
        user-feed:
          ttl-seconds: 180        # 3 minutes
          max-cache-size: 1000    # Max posts per user feed cache
        
        post-scores:
          ttl-seconds: 600        # 10 minutes for score cache
        
        user-interests:
          ttl-seconds: 3600       # 1 hour for interest cache
      
      # Background Jobs
      jobs:
        trending-calculator:
          enabled: true
          cron: "0 */5 * * * *"   # Every 5 minutes
          batch-size: 1000        # Posts to process per batch
          
        score-updater:
          enabled: true
          cron: "0 */2 * * * *"   # Every 2 minutes
          batch-size: 500
          
        cold-start-handler:
          enabled: true
          cron: "0 0 */6 * * *"   # Every 6 hours
          
      # Performance Tuning
      performance:
        max-posts-to-score: 5000   # Max posts to consider for trending
        min-engagement-threshold: 5 # Min likes+comments to consider
        enable-score-caching: true
        enable-parallel-processing: true
        parallel-threads: 4
        
      # Edge Case Handling
      edge-cases:
        new-user-default-trending: true   # Show global trending to new users
        min-following-for-personalization: 5  # Min follows before personalization kicks in
        fallback-to-global: true          # Fallback if user feed empty
        filter-nsfw: true
        filter-shadowbanned: true

