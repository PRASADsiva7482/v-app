# Keycloak Configuration
# This application validates JWT tokens with Keycloak's token introspection endpoint
# Every API call requires a valid JWT token in the Authorization header

# Enable/Disable Keycloak token validation
keycloak.enabled=true

# Keycloak server URL (without /auth suffix for newer versions)
keycloak.auth-server-url=http://localhost:8080/auth

# Keycloak realm name
keycloak.realm=myrealm

# Client ID (resource name)
keycloak.resource=myclient

# Client secret for confidential clients
keycloak.credentials.secret=your-client-secret

# Grant type for token exchange
keycloak.grant-type=urn:ietf:params:oauth:grant-type:uma-ticket

# Audience for token validation
keycloak.audience=your-audience

# Keycloak SSL Configuration (set to none for development)
keycloak.ssl-required=external
keycloak.public-client=false
keycloak.confidential-port=0

# Keycloak Bearer Token Configuration
keycloak.bearer-only=true
keycloak.use-resource-role-mappings=true
keycloak.principal-attribute=preferred_username

# Token Introspection Endpoint (constructed automatically)
# Format: {auth-server-url}/realms/{realm}/protocol/openid-connect/token/introspect
# This endpoint is used to validate JWT tokens on every API call
