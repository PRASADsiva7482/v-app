# =============================================================================
# Redis Cache Configuration
# =============================================================================
# This file contains Redis-specific properties for caching layer integration
# Redis acts as a Cache-Aside (Lazy Loading) layer between Spring Boot and MySQL

# Redis Connection Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
spring.data.redis.connect-timeout=10000

# Connection Pool Settings (Lettuce - default Spring Boot Redis client)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL:600000}
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=v-app:

# Enable/Disable Caching Globally
spring.cache.redis.enable-statistics=true
cache.enabled=${REDIS_CACHE_ENABLED:true}

# Logging for Redis
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.cache=DEBUG
