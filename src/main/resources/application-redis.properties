# =============================================================================
# Redis Configuration for V-App
# =============================================================================
# This configuration enables Redis caching with VPN support.
# Redis is running in Docker Desktop and accessible from multiple machines.
#
# IMPORTANT: For VPN access from 2nd laptop or other machines:
# - Use the VPN server IP address (not localhost)
# - Ensure Redis Docker container is configured to bind to 0.0.0.0
# - Open Redis port (6379) in firewall
# =============================================================================

# -----------------------------------------------------------------------------
# Redis Connection Settings
# -----------------------------------------------------------------------------

# Redis Host Configuration
# For local development: localhost
# For VPN access from other machines: VPN server IP (e.g., 100.122.105.63)
spring.data.redis.host=100.122.105.63

# Redis Port (default: 6379)
spring.data.redis.port=6379

# Redis Password (if configured)
# Leave empty if Redis has no password set
spring.data.redis.password=

# Redis Database Index (0-15, default: 0)
spring.data.redis.database=0

# -----------------------------------------------------------------------------
# Redis Connection Pool Settings (Lettuce)
# -----------------------------------------------------------------------------

# Maximum number of connections in the pool
spring.data.redis.lettuce.pool.max-active=8

# Maximum number of idle connections in the pool
spring.data.redis.lettuce.pool.max-idle=8

# Minimum number of idle connections to maintain in the pool
spring.data.redis.lettuce.pool.min-idle=0

# Maximum amount of time a connection allocation should block before throwing an exception
spring.data.redis.lettuce.pool.max-wait=2000ms

# -----------------------------------------------------------------------------
# Redis Connection Timeout
# -----------------------------------------------------------------------------

# Connection timeout
spring.data.redis.timeout=3000ms

# Command timeout
spring.data.redis.lettuce.shutdown-timeout=100ms

# -----------------------------------------------------------------------------
# Redis Cache Configuration
# -----------------------------------------------------------------------------

# Enable Redis caching
spring.cache.type=redis

# Cache key prefix (helps identify cache entries)
spring.cache.redis.key-prefix=v-app:

# Use key prefix
spring.cache.redis.use-key-prefix=true

# Default TTL for cache entries (in milliseconds)
# 30 minutes = 1800000ms
spring.cache.redis.time-to-live=1800000

# Whether to cache null values
spring.cache.redis.cache-null-values=false

# -----------------------------------------------------------------------------
# Redis Sentinel Configuration (Optional - for production HA)
# -----------------------------------------------------------------------------
# Uncomment and configure if using Redis Sentinel for high availability

#spring.data.redis.sentinel.master=mymaster
#spring.data.redis.sentinel.nodes=100.122.105.63:26379,100.122.105.64:26379,100.122.105.65:26379

# -----------------------------------------------------------------------------
# Redis Cluster Configuration (Optional - for production scaling)
# -----------------------------------------------------------------------------
# Uncomment and configure if using Redis Cluster

#spring.data.redis.cluster.nodes=100.122.105.63:6379,100.122.105.64:6379,100.122.105.65:6379
#spring.data.redis.cluster.max-redirects=3

# =============================================================================
# Docker Desktop Redis Setup for VPN Access
# =============================================================================
# 
# To run Redis in Docker Desktop with VPN access:
#
# 1. Create redis.conf file:
#    bind 0.0.0.0
#    protected-mode no
#    port 6379
#
# 2. Run Redis container:
#    docker run -d \
#      --name v-app-redis \
#      -p 6379:6379 \
#      -v /path/to/redis.conf:/usr/local/etc/redis/redis.conf \
#      redis:latest redis-server /usr/local/etc/redis/redis.conf
#
# 3. Or use docker-compose.yml:
#    version: '3.8'
#    services:
#      redis:
#        image: redis:latest
#        container_name: v-app-redis
#        ports:
#          - "6379:6379"
#        command: redis-server --bind 0.0.0.0 --protected-mode no
#        volumes:
#          - redis-data:/data
#    volumes:
#      redis-data:
#
# 4. Open firewall port:
#    Windows: New-NetFirewallRule -DisplayName "Redis Server" -Direction Inbound -LocalPort 6379 -Protocol TCP -Action Allow
#    Linux: sudo ufw allow 6379/tcp
#
# 5. Test Redis connection from VPN client:
#    redis-cli -h 100.122.105.63 -p 6379 ping
#
# =============================================================================
# Environment-Specific Configuration
# =============================================================================
#
# Development (localhost):
#   spring.data.redis.host=localhost
#
# VPN Server (accessible from other laptops):
#   spring.data.redis.host=100.122.105.63
#
# Production (dedicated Redis server):
#   spring.data.redis.host=redis.yourdomain.com
#   spring.data.redis.password=strong-password-here
#   spring.data.redis.ssl.enabled=true
#
# Multiple Environments (using profiles):
#   - Create application-redis-dev.properties (localhost)
#   - Create application-redis-vpn.properties (VPN IP)
#   - Create application-redis-prod.properties (production)
#   - Activate with: spring.profiles.active=dev,redis-dev
#
# =============================================================================
