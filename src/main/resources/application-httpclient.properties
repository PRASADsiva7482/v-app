# ==============================================================================
# HTTP Client Configuration
# ==============================================================================
# Configuration for HttpCallerService - Apache HttpClient 5
# These settings control connection pooling, timeouts, and resource management

# Connection timeout (ms) - Time to establish a connection
# Default: 5000ms (5 seconds)
http.client.connection.timeout=5000

# Socket timeout (ms) - Time to wait for data after connection is established
# Default: 30000ms (30 seconds)
http.client.socket.timeout=30000

# Maximum total connections in the pool
# Default: 100
http.client.max.connections=100

# Maximum connections per route (per host)
# Default: 20
http.client.max.connections.per.route=20

# ==============================================================================
# Example Configurations for Different Scenarios
# ==============================================================================

# For fast internal APIs (low latency):
# http.client.connection.timeout=2000
# http.client.socket.timeout=5000

# For slow external APIs (high latency):
# http.client.connection.timeout=10000
# http.client.socket.timeout=60000

# For high-traffic applications:
# http.client.max.connections=200
# http.client.max.connections.per.route=50
