      username: ${DB_CRM_USERNAME:root}
      password: ${DB_CRM_PASSWORD}
      poolName: CRM-POOL
      maximumPoolSize: ${DB_POOL_MAX_SIZE:10}
      minimumIdle: ${DB_POOL_MIN_IDLE:10}
