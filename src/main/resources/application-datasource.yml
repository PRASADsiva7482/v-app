datasource:
   crmdatasource:
   -  name: initial
      jdbcUrl: ${DB_CRM_URL:jdbc:mysql://localhost:3306/v_app?zeroDateTimeBehavior=convertToNull&autoReconnect=true&useSSL=true&nullNamePatternMatchesAll=true&useUnicode=yes&requireSSL=true&allowPublicKeyRetrieval=true&sessionVariables=sql_require_primary_key=0&characterEncoding=UTF-8}
